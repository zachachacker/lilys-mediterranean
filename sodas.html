<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Lunch sodas · Lily's</title>
<!-- Kareem ticks the canned sodas he stocks (2026-10-16). Saving updates the
     order page straight away (sodas function -> addon_options "lunch-soda").
     Reusable whenever stock changes. The link carries its token in #t=. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --green: #14532b; --foam: #F4F1E8; --char: #1A1E1C; --ember: #B4472B; --muted: #5d625f; --card: #fff; --line: #e3ded2; }
  @media (prefers-color-scheme: dark) { :root { --foam: #141816; --char: #F4F1E8; --muted: #a9afab; --card: #1d2220; --line: #2c322f; } }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--foam); color: var(--char); font: 18px/1.5 "Public Sans", -apple-system, sans-serif; -webkit-text-size-adjust: 100%; }
  header { background: var(--green); color: #F4F1E8; padding: 26px 16px 22px; }
  header h1 { font: 700 30px/1.1 "Fraunces", Georgia, serif; }
  header p { margin-top: 8px; opacity: 0.92; }
  main { max-width: 560px; margin: 0 auto; padding: 18px 16px 48px; }
  .grid { display: grid; gap: 10px; }
  label.s { display: flex; align-items: center; gap: 14px; background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 14px 16px; font-weight: 600; cursor: pointer; }
  label.s:has(input:checked) { border-color: var(--green); }
  label.s input { width: 26px; height: 26px; accent-color: var(--green); flex: none; }
  h2 { font-size: 16px; margin: 22px 0 8px; color: var(--muted); font-weight: 600; }
  input.o { width: 100%; font: inherit; padding: 13px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--card); color: var(--char); }
  button { margin-top: 22px; width: 100%; min-height: 58px; border: 0; border-radius: 99px; background: var(--ember); color: #fff; font: 700 19px "Public Sans", sans-serif; cursor: pointer; }
  button:disabled { opacity: 0.6; }
  .msg { margin-top: 16px; padding: 14px 16px; border-radius: 12px; font-weight: 600; }
  .msg.ok { background: #e3f1e6; color: #14532b; }
  .msg.err { background: #fbe6e2; color: #8c2a1b; }
</style>
</head>
<body>
<header>
  <h1>Lunch sodas</h1>
  <p>Tick the canned sodas you have. Customers choose one with their lunch wrap.</p>
</header>
<main>
  <form id="f">
    <div class="grid" id="list"></div>
    <h2>Anything else? Type it here</h2>
    <div class="grid">
      <input class="o" type="text" maxlength="40" placeholder="Other soda">
      <input class="o" type="text" maxlength="40" placeholder="Other soda">
      <input class="o" type="text" maxlength="40" placeholder="Other soda">
    </div>
    <button type="submit" id="save">Save</button>
    <div class="msg" id="msg" hidden></div>
  </form>
</main>
<script src="data.js"></script>
<script>
(() => {
  const O = window.LILYS.ORDERING;
  const token = new URLSearchParams(location.hash.slice(1)).get("t") || "";
  const COMMON = ["Coca-Cola", "Diet Coke", "Coke Zero", "Sprite", "Fanta Orange", "Dr Pepper",
    "Pepsi", "Diet Pepsi", "Mountain Dew", "Ginger Ale", "Root Beer"];
  const $ = (id) => document.getElementById(id);
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const show = (text, ok) => { const m = $("msg"); m.textContent = text; m.className = "msg " + (ok ? "ok" : "err"); m.hidden = false; };

  function paint(current) {
    const have = new Set(current.map((n) => n.toLowerCase()));
    const extra = current.filter((n) => !COMMON.some((c) => c.toLowerCase() === n.toLowerCase()));
    $("list").innerHTML = [...COMMON, ...extra].map((n) =>
      `<label class="s"><input type="checkbox" value="${esc(n)}"${have.has(n.toLowerCase()) ? " checked" : ""}>${esc(n)}</label>`).join("");
  }

  // what's saved now, so a second visit starts from his current list
  fetch(`${O.supabaseUrl}/rest/v1/addon_options?select=name&group_id=eq.lunch-soda&order=sort`, {
    headers: { apikey: O.anonKey, Authorization: `Bearer ${O.anonKey}` },
  }).then((r) => r.ok ? r.json() : []).then((rows) => paint(rows.map((r) => r.name))).catch(() => paint([]));

  if (!token) show("This link is missing its code. Ask Zachary for the link again.", false);

  $("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const sodas = [...document.querySelectorAll("#list input:checked")].map((i) => i.value)
      .concat([...document.querySelectorAll("input.o")].map((i) => i.value.trim()).filter(Boolean));
    $("save").disabled = true;
    try {
      const r = await fetch(`${O.supabaseUrl}/functions/v1/sodas`, {
        method: "POST",
        headers: { apikey: O.anonKey, Authorization: `Bearer ${O.anonKey}`, "Content-Type": "application/json" },
        body: JSON.stringify({ token, sodas }),
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || "Couldn't save just now. Please try again.");
      document.querySelectorAll("input.o").forEach((i) => { i.value = ""; });
      paint(j.sodas);
      show(j.sodas.length ? `Saved! Customers now choose from: ${j.sodas.join(", ")}.` : "Saved. No sodas listed for now.", true);
    } catch (err) {
      show(err.message, false);
    } finally {
      $("save").disabled = false;
    }
  });
})();
</script>
</body>
</html>
